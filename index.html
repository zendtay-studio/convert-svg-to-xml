<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Convierte archivos SVG a XML Vector Drawable para Android de forma rápida y sencilla. Herramienta online gratuita para desarrolladores." />
    <meta name="keywords" content="SVG a XML, convertidor SVG, Vector Drawable, Android Studio, desarrollo Android, herramienta desarrollo" />
    <meta name="author" content="ZendTay Studio" />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Convertidor SVG a XML Vector Drawable" />
    <meta property="og:description" content="Herramienta online gratuita para convertir SVG a XML compatible con Android" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://zendtay-studio.github.io/convert-svg-to-xml/" />
    <meta property="og:image" content="img/ic.png" />
    <title>Convertidor SVG a XML | Herramienta para desarrolladores Android</title>
    <!-- Favicon PNG tradicional -->
    <link rel="icon" type="image/png" href="img/ic.png">
    <!-- Para Apple devices -->
    <link rel="apple-touch-icon" href="img/ic.png">
    <style>
:root {
        --primary: #1e5d7c;
        --primary-dark: #164a63;
        --secondary: #d2e6f5;
        --secondary-dark: #c0daf0;
        --background: #f2f3f5;
        --text: #333;
        --card-bg: #fff;
        --textarea-border: #e0e0e0;
        --toast-bg: #333;
    }

        body.dark-mode {
            --primary: #90caf9;
            --primary-dark: #64b5f6;
            --secondary: #1e1e1e;
            --secondary-dark: #333;
            --background: #121212;
            --text: #f5f5f5;
            --card-bg: #1e1e1e;
            --textarea-border: #444;
            --toast-bg: #f5f5f5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--background);
            color: var(--text);
            padding: 20px;
            min-height: 100vh;
            position: relative;
            transition: background 0.3s, color 0.3s;
        }

        .dark-mode-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.2);
            color: var(--text);
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding-top: 60px;
        }

        h1, h2 {
            font-size: 28px;
            font-weight: bold;
            color: var(--text);
            margin-bottom: 30px;
            text-align: left;
        }

        .section {
            margin-bottom: 50px;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            color: var(--text);
            margin-bottom: 15px;
        }

        .textarea-container {
            position: relative;
            margin-bottom: 15px;
        }

        .textarea-container .icon {
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 20px;
            z-index: 2;
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 15px;
            padding-right: 45px;
            border: 2px solid var(--textarea-border);
            border-radius: 12px;
            background-color: var(--card-bg);
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.4;
            color: var(--text);
            resize: vertical;
            outline: none;
            transition: all 0.3s ease;
        }

        textarea:focus {
            border-color: var(--primary);
        }

        .button-group {
            display: flex;
            gap: 0;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .btn {
            flex: 1;
            padding: 15px 20px;
            font-size: 16px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
        }

        .btn-secondary {
            background-color: var(--secondary);
            color: var(--primary);
        }

        .btn-secondary:hover {
            background-color: var(--secondary-dark);
        }

        .hidden-input {
            display: none;
        }

@media (max-width: 480px) {
            body {
                padding: 15px;
            }

            .container {
                padding-top: 50px;
            }

            h1 {
                font-size: 24px;
                margin-bottom: 25px;
            }

            textarea {
                height: 200px;
                font-size: 11px;
                padding: 12px;
                padding-right: 40px;
            }

            .btn {
                padding: 12px 16px;
                font-size: 14px;
            }

            .dark-mode-toggle {
                top: 15px;
                right: 15px;
                font-size: 20px;
            }
        }
           .footer {
            margin-top: 40px;
            text-align: center;
            font-size: 14px;
            color: var(--text);
        }

        .footer a {
            color: var(--primary);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .footer a:hover {
            color: var(--primary-dark);
        }
    </style>
</head>
<body>
    <button class="dark-mode-toggle" onclick="toggleDarkMode()">🌙</button>

    <div class="container">
        <h1>SVG to XML</h1>

        <div class="section">
            <div class="textarea-container">
                <div class="icon">
                    🤖
                </div>
                <textarea id="svgInput" placeholder="Pega tu código SVG aquí..."></textarea>
            </div>
            <div class="button-group">
                <button class="btn btn-primary" onclick="convert(); toggleButtonGroup(this)">Convertir</button>
                <button class="btn btn-secondary" onclick="selectFile(); toggleButtonGroup(this)">Seleccionar</button>
            </div>
        </div>

        <h2>XML (Vector)</h2>
        <div class="textarea-container">
            <textarea id="xmlOutput" readonly></textarea>
        </div>
        <div class="button-group">
            <button class="btn btn-secondary" onclick="copyXML(); toggleButtonGroup(this)">Copiar</button>
            <button class="btn btn-primary" onclick="downloadXML(); toggleButtonGroup(this)">Descargar</button>
        </div>

        <div class="section-title">
            Alternativa confiable para convertir SVG a XML (svg2android)
        </div>
        <div class="button-group">
            <button class="btn btn-primary" onclick="window.open('https://inloop.github.io/svg2android/', '_blank'); toggleButtonGroup(this)">Visitar Web</button>
            <!-- <button class="btn btn-secondary" onclick="window.open('https://inloop.github.io/svg2android/', '_blank'); toggleButtonGroup(this)">Descargar App</button> -->
        </div>
    </div>
        <div class="footer">
        <p>&copy; 2025 ZendTay Studio™. Todos los derechos reservados. 
  <a href="#privacy-policy" onclick="window.open('https://zendtay-studio.github.io/privacy-policy', '_blank')">Política de Privacidad</a></p>
    </div>
    <input type="file" id="fileInput" class="hidden-input" accept=".svg" onchange="handleFile(event)">

    <script>

        (function restoreDarkMode() {
            const isDark = localStorage.getItem('darkMode') === 'true';
            if (isDark) {
                document.body.classList.add('dark-mode');
                const toggle = document.querySelector('.dark-mode-toggle');
                if (toggle) toggle.textContent = '☀️';
            }
        })();


        function toggleDarkMode() {
            const body = document.body;
            const toggle = document.querySelector('.dark-mode-toggle');
            const isDark = body.classList.toggle('dark-mode');
            toggle.textContent = isDark ? '☀️': '🌙';
            localStorage.setItem('darkMode',
                isDark ? 'true': 'false');
        }

        function selectFile() {
            document.getElementById('fileInput').click();
        }

        function handleFile(event) {
            const file = event.target.files[0];
            if (!file || !file.name.endsWith('.svg')) {
                alert("Por favor selecciona un archivo .svg válido.");
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('svgInput').value = e.target.result;
                convert();
            };
            reader.readAsText(file);
        }

        function convert() {
            const svgString = document.getElementById("svgInput").value;
            try {
                const xmlResult = svgToVectorDrawable(svgString);
                document.getElementById("xmlOutput").value = xmlResult;
            } catch (err) {
                document.getElementById("xmlOutput").value = "Error: " + err.message;
            }
        }

        function copyXML() {
            const output = document.getElementById("xmlOutput");
            output.select();
            output.setSelectionRange(0, 99999);

            try {
                document.execCommand("copy");
                showToast("XML copiado al portapapeles");
            } catch (err) {
                navigator.clipboard.writeText(output.value).then(() => {
                    showToast("XML copiado al portapapeles");
                }).catch(() => {
                    showToast("Error al copiar");
                });
            }
        }

        function downloadXML() {
            const xmlContent = document.getElementById("xmlOutput").value;
            const blob = new Blob([xmlContent], {
                type: 'text/xml'
            });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "vector_drawable.xml";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast("Archivo descargado");
        }

        function toggleButtonGroup(clickedBtn) {
            const group = clickedBtn.parentElement;
            const buttons = group.querySelectorAll('.btn');
            buttons.forEach(btn => {
                btn.classList.remove('btn-primary');
                btn.classList.add('btn-secondary');
            });
            clickedBtn.classList.remove('btn-secondary');
            clickedBtn.classList.add('btn-primary');
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.textContent = message;
            toast.style.cssText = `
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--toast-bg);
            color: ${document.body.classList.contains('dark-mode') ? '#121212': '#fff'};
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
            `;
            document.body.appendChild(toast);
            setTimeout(() => toast.style.opacity = '1', 100);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => document.body.removeChild(toast), 300);
            }, 2000);
        }

        function svgToVectorDrawable(svgString) {
            const parser = new DOMParser();
            const svgDoc = parser.parseFromString(svgString, "image/svg+xml");
            const svgEl = svgDoc.querySelector('svg');
            if (!svgEl) throw new Error("No se encontró elemento <svg>");

            let width = svgEl.getAttribute('width') || '24';
            let height = svgEl.getAttribute('height') || '24';
            width = width.replace(/[^\d.]/g, '');
            height = height.replace(/[^\d.]/g, '');
            const viewBox = svgEl.getAttribute('viewBox') || `0 0 ${width} ${height}`;
            const [minX,
                minY,
                vWidth,
                vHeight] = viewBox.split(/\s+/);

            const paths = svgDoc.querySelectorAll('path');
            if (paths.length === 0) throw new Error("No se encontraron elementos <path>");

            let pathElements = '';
            paths.forEach(path => {
                const d = path.getAttribute('d');
                const fill = path.getAttribute('fill') || '#000000';
                const stroke = path.getAttribute('stroke');
                const strokeWidth = path.getAttribute('stroke-width');

                if (d) {
                    pathElements += `<path`;
                    if (fill && fill !== 'none') {
                        pathElements += `\n    android:fillColor="${fill}"`;
                    }
                    if (stroke && stroke !== 'none') {
                        pathElements += `\n    android:strokeColor="${stroke}"`;
                        if (strokeWidth) {
                            pathElements += `\n    android:strokeWidth="${strokeWidth}"`;
                        }
                    }
                    pathElements += `\n    android:pathData="${d}" />\n`;
                }
            });

            return `<?xml version="1.0" encoding="utf-8"?>\n<vector xmlns:android="http://schemas.android.com/apk/res/android"\n    android:width="${width}dp"\n    android:height="${height}dp"\n    android:viewportWidth="${vWidth}"\n    android:viewportHeight="${vHeight}">\n${pathElements}</vector>`;
        }

        // Selección de contenido
        document.getElementById('svgInput').addEventListener('click', function () {
            this.select();
        });

        document.getElementById('xmlOutput').addEventListener('click', function () {
            this.select();
        });

        document.getElementById('svgInput').addEventListener('input', function () {
            if (this.value.trim()) convert();
        });
    </script>
</body>
</html>
