<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SVG to XML</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f2f3f5;
      padding: 20px;
      min-height: 100vh;
      position: relative;
    }

    .dark-mode-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      background-color: rgba(255, 255, 255, 0.8);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding-top: 60px;
    }

    h1 {
      font-size: 28px;
      font-weight: bold;
      color: #333;
      margin-bottom: 30px;
      text-align: left;
    }
    
    h2 {
      font-size: 28px;
      font-weight: bold;
      color: #333;
      margin-bottom: 30px;
      text-align: left;
      text-decoration: none;
    }
    
    .link {
      text-decoration: none;
      color: #1a73e8;
    }

    .section {
      margin-bottom: 50px;
    }

    .section-title {
      font-size: 18px;
      font-weight: bold;
      color: #333;
      margin-bottom: 15px;
    }

    .textarea-container {
      position: relative;
      margin-bottom: 15px;
    }

    .textarea-container .icon {
      position: absolute;
      top: 12px;
      right: 12px;
      font-size: 20px;
      z-index: 2;
    }

    textarea {
      width: 100%;
      height: 200px;
      padding: 15px;
      padding-right: 45px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      background-color: #ffffff;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      line-height: 1.4;
      color: #666;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s ease;
    }

    textarea:focus {
      border-color: #1e5d7c;
    }

    .button-group {
      display: flex;
      gap: 0;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .btn {
      flex: 1;
      padding: 15px 20px;
      font-size: 16px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      outline: none;
    }

    .btn-primary {
      background-color: #1e5d7c;
      color: white;
    }

    .btn-primary:hover {
      background-color: #164a63;
    }

    .btn-secondary {
      background-color: #d2e6f5;
      color: #1e5d7c;
    }

    .btn-secondary:hover {
      background-color: #c0daf0;
    }

    .hidden-input {
      display: none;
    }

    @media (max-width: 480px) {
      body {
        padding: 15px;
      }

      .container {
        padding-top: 50px;
      }

      h1 {
        font-size: 24px;
        margin-bottom: 25px;
      }

      textarea {
        height: 200px;
        font-size: 11px;
        padding: 12px;
        padding-right: 40px;
      }

      .btn {
        padding: 12px 16px;
        font-size: 14px;
      }

      .dark-mode-toggle {
        top: 15px;
        right: 15px;
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  
  <div class="container">
    <h1>SVG</h1>
    
    <div class="section">
      <div class="textarea-container">
        <div class="icon"></div>
        <textarea id="svgInput" placeholder="Pega tu código SVG aquí..."></textarea>
      </div>
      <div class="button-group">
        <button class="btn btn-primary" onclick="convert()">Convertir</button>
        <button class="btn btn-secondary" onclick="selectFile()">Seleccionar</button>
      </div>
    </div>

    <div class="section">
      <div class="section-title">XML (Vector)</div>
      <div class="textarea-container">
        <textarea id="xmlOutput" readonly></textarea>
      </div>
      <div class="button-group">
        <button class="btn btn-primary" onclick="copyXML()">Copiar</button>
        <button class="btn btn-secondary" onclick="downloadXML()">Descargar</button>
      </div>
    </div>
  </div>
  
  <div class="section-title">Alternativa confiable para convertir SVG a XML</div>
  <div class="button-group">
  <button class="btn btn-primary" onclick="window.open('https://inloop.github.io/svg2android/', '_blank')">Visitar</button>
</div>

  <input type="file" id="fileInput" class="hidden-input" accept=".svg" onchange="handleFile(event)">

  <script>
    function selectFile() {
      document.getElementById('fileInput').click();
    }

    function handleFile(event) {
      const file = event.target.files[0];
      if (!file || !file.name.endsWith('.svg')) {
        alert("Por favor selecciona un archivo .svg válido.");
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('svgInput').value = e.target.result;
        convert();
      };
      reader.readAsText(file);
    }

    function convert() {
      const svgString = document.getElementById("svgInput").value;
      try {
        const xmlResult = svgToVectorDrawable(svgString);
        document.getElementById("xmlOutput").value = xmlResult;
      } catch (err) {
        document.getElementById("xmlOutput").value = "Error: " + err.message;
      }
    }

    function copyXML() {
      const output = document.getElementById("xmlOutput");
      output.select();
      output.setSelectionRange(0, 99999);
      
      try {
        document.execCommand("copy");
        showToast("XML copiado al portapapeles");
      } catch (err) {
        // Fallback para navegadores modernos
        navigator.clipboard.writeText(output.value).then(() => {
          showToast("XML copiado al portapapeles");
        }).catch(() => {
          showToast("Error al copiar");
        });
      }
    }

    function downloadXML() {
      const xmlContent = document.getElementById("xmlOutput").value;
      const blob = new Blob([xmlContent], { type: 'text/xml' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = "vector_drawable.xml";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast("Archivo descargado");
    }

    function showToast(message) {
      // Crear toast notification
      const toast = document.createElement('div');
      toast.textContent = message;
      toast.style.cssText = `
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: #333;
        color: white;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 14px;
        z-index: 1000;
        opacity: 0;
        transition: opacity 0.3s ease;
      `;
      
      document.body.appendChild(toast);
      
      // Mostrar toast
      setTimeout(() => toast.style.opacity = '1', 100);
      
      // Ocultar toast después de 2 segundos
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => document.body.removeChild(toast), 300);
      }, 2000);
    }

    function svgToVectorDrawable(svgString) {
      const parser = new DOMParser();
      const svgDoc = parser.parseFromString(svgString, "image/svg+xml");
      const svgEl = svgDoc.querySelector('svg');

      if (!svgEl) throw new Error("No se encontró elemento <svg>");

      // Obtener dimensiones
      let width = svgEl.getAttribute('width') || '24';
      let height = svgEl.getAttribute('height') || '24';
      
      // Limpiar unidades
      width = width.replace(/[^\d.]/g, '');
      height = height.replace(/[^\d.]/g, '');

      const viewBox = svgEl.getAttribute('viewBox') || `0 0 ${width} ${height}`;
      const [minX, minY, vWidth, vHeight] = viewBox.split(/\s+/);

      // Buscar elementos path
      const paths = svgDoc.querySelectorAll('path');
      if (paths.length === 0) throw new Error("No se encontraron elementos <path>");

      let pathElements = '';
      paths.forEach(path => {
        const d = path.getAttribute('d');
        const fill = path.getAttribute('fill') || '#000000';
        const stroke = path.getAttribute('stroke');
        const strokeWidth = path.getAttribute('stroke-width');
        
        if (d) {
          pathElements += `
  <path`;
          
          if (fill && fill !== 'none') {
            pathElements += `
      android:fillColor="${fill}"`;
          }
          
          if (stroke && stroke !== 'none') {
            pathElements += `
      android:strokeColor="${stroke}"`;
            if (strokeWidth) {
              pathElements += `
      android:strokeWidth="${strokeWidth}"`;
            }
          }
          
          pathElements += `
      android:pathData="${d}" />`;
        }
      });

      return `<?xml version="1.0" encoding="utf-8"?>
<vector xmlns:android="http://schemas.android.com/apk/res/android"
    android:width="${width}dp"
    android:height="${height}dp"
    android:viewportWidth="${vWidth || width}"
    android:viewportHeight="${vHeight || height}">
${pathElements}
</vector>`;
    }

    // Permitir hacer clic en los textareas para seleccionar todo el contenido
    document.getElementById('svgInput').addEventListener('click', function() {
      this.select();
    });

    document.getElementById('xmlOutput').addEventListener('click', function() {
      this.select();
    });

    // Convertir automáticamente cuando se modifica el SVG
    document.getElementById('svgInput').addEventListener('input', function() {
      if (this.value.trim()) {
        convert();
      }
    });
  </script>
</body>
</html>
